<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>나에게 맞는 직무 유형 테스트</title>
    <meta
      name="description"
      content="진로를 고민하는 대학생 2~4학년을 위한 12개 질문 기반 직무 적성 테스트"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --page-bg: #fef9e7;
        --header-border: rgba(239, 227, 182, 0.85);
        --text-main: #1f1b16;
        --text-sub: #4f473b;
        --text-muted: #736857;
        --card-bg: #ffffff;
        --card-border: #ede0b0;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        font-family: 'Plus Jakarta Sans', 'IBM Plex Sans KR', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
        background-color: var(--page-bg);
        color: var(--text-main);
        -webkit-font-smoothing: antialiased;
      }

      ::selection {
        background: #fde68a;
        color: #1f1b16;
      }

      button {
        font-family: inherit;
        cursor: pointer;
        border: none;
        background: none;
      }

      button:focus-visible {
        outline: 2px solid #1f1b16;
        outline-offset: 2px;
      }

      .app-shell {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        background-color: var(--page-bg);
        transition: background-color 0.45s ease;
      }

      /* Header */
      .top-header {
        width: 100%;
        border-bottom: 1px solid var(--header-border);
        background-color: var(--page-bg);
        transition: background-color 0.45s ease, border-color 0.45s ease;
      }

      .top-header-inner {
        max-width: 1024px;
        margin: 0 auto;
        padding: 14px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .brand-btn {
        font-size: 16px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--text-main);
        padding: 4px 2px;
        border-radius: 6px;
        white-space: nowrap;
      }

      .header-right-note {
        display: none;
        font-size: 12px;
        font-weight: 500;
        color: #7a6a42;
        white-space: nowrap;
      }

      .header-home-btn {
        min-height: 36px;
        padding: 6px 12px;
        border-radius: 12px;
        font-size: 12px;
        font-weight: 600;
        color: #4f473b;
        transition: background-color 0.15s ease, color 0.15s ease;
        white-space: nowrap;
      }

      .header-home-btn:hover {
        background-color: rgba(0, 0, 0, 0.05);
        color: #1f1b16;
      }

      /* Main Stage */
      .main-stage {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 24px 16px;
      }

      .container-wide {
        width: 100%;
        max-width: 1024px;
        margin: 0 auto;
      }

      .container-quiz {
        width: 100%;
        max-width: 768px;
        margin: 0 auto;
      }

      /* Cards & Surfaces */
      .rounded-card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 24px;
        box-shadow: 0 14px 40px -20px rgba(140, 104, 14, 0.16);
      }

      /* Start Screen */
      .start-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 24px;
        padding: 24px;
      }

      .kicker {
        margin: 0;
        font-size: 14px;
        font-weight: 500;
        color: #7a6a42;
      }

      .start-title {
        margin: 12px 0 0;
        font-size: 30px;
        font-weight: 700;
        line-height: 1.2;
        letter-spacing: -0.025em;
      }

      .start-desc {
        margin: 16px 0 0;
        max-width: 560px;
        font-size: 16px;
        line-height: 1.65;
        color: var(--text-sub);
      }

      .tracks-box {
        margin-top: 28px;
        padding-top: 24px;
        border-top: 1px solid #f3ebd0;
      }

      .tracks-label {
        margin: 0;
        font-size: 12px;
        font-weight: 600;
        color: #7a6a42;
      }

      .tracks-grid {
        margin: 12px 0 0;
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px 24px;
      }

      .tracks-grid dt {
        font-size: 14px;
        font-weight: 600;
        color: #1f1b16;
      }

      .tracks-grid dd {
        margin: 2px 0 0;
        font-size: 12px;
        line-height: 1.5;
        color: #645a4b;
      }

      .start-cta-row {
        margin-top: 32px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        align-items: stretch;
      }

      .primary-cta {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 52px;
        padding: 14px 32px;
        border-radius: 16px;
        background-color: #fbbf24;
        color: #1f1b16;
        font-size: 16px;
        font-weight: 700;
        box-shadow: 0 6px 0 #d99b06;
        transition: transform 0.16s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.16s ease;
        white-space: nowrap;
      }

      .primary-cta:hover {
        background-color: #f59e0b;
        transform: translateY(-2px) scale(1.015);
      }

      .primary-cta:active {
        transform: translateY(2px) scale(0.97);
      }

      .cta-hint {
        font-size: 12px;
        color: var(--text-muted);
        text-align: center;
      }

      .illustration-frame {
        border-radius: 18px;
        background: #fef9e7;
        border: 1px solid #efe3b6;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }

      .illustration-frame svg {
        width: 100%;
        height: auto;
        display: block;
      }

      /* Question Screen */
      .progress-box {
        margin-bottom: 20px;
        padding: 14px 16px;
        border-radius: 18px;
        border: 1px solid #ede0b0;
        background: rgba(255, 255, 255, 0.92);
      }

      .progress-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .back-btn {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        min-height: 36px;
        padding: 6px 10px;
        border-radius: 12px;
        font-size: 12px;
        font-weight: 600;
        color: #5c5346;
        transition: background-color 0.15s ease, color 0.15s ease;
      }

      .back-btn:hover {
        background-color: #fef3c7;
        color: #1f1b16;
      }

      .progress-count {
        font-size: 14px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }

      .progress-count .current {
        color: #b45309;
      }

      .progress-count .sep {
        color: #a89a78;
        margin: 0 2px;
      }

      .progress-track {
        margin-top: 10px;
        height: 10px;
        width: 100%;
        border-radius: 999px;
        background: #fef3c7;
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        border-radius: 999px;
        background: #f59e0b;
        transition: width 0.32s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .question-card {
        padding: 20px;
        animation: cardSlideIn 0.24s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .question-meta {
        margin: 0;
        font-size: 12px;
        font-weight: 600;
        color: #9a6b0a;
        font-variant-numeric: tabular-nums;
      }

      .question-prompt {
        margin: 10px 0 0;
        font-size: 20px;
        font-weight: 700;
        line-height: 1.4;
        color: #1f1b16;
      }

      .options-grid {
        margin-top: 24px;
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .option-card {
        width: 100%;
        min-height: 132px;
        padding: 20px;
        border-radius: 24px;
        border: 2px solid #f1e6be;
        background: #fffdf8;
        text-align: left;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        transition:
          transform 0.18s cubic-bezier(0.16, 1, 0.3, 1),
          border-color 0.16s ease,
          background-color 0.16s ease,
          box-shadow 0.16s ease;
      }

      .option-card:hover:not(:disabled) {
        transform: translateY(-3px) scale(1.01);
        border-color: #f59e0b;
        background: #fff9e2;
      }

      .option-card:active:not(:disabled) {
        transform: scale(0.97);
      }

      .option-card.prev-picked {
        border-color: #f59e0b;
        background: #fffdf2;
      }

      .option-card.selected-bounce {
        border-color: #e59400;
        background: #fff8dc;
        box-shadow: 0 10px 24px -12px rgba(217, 119, 6, 0.35);
        animation: bouncePop 0.34s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .option-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .option-badge {
        width: 32px;
        height: 32px;
        border-radius: 12px;
        background: #fef3c7;
        color: #7a5908;
        font-size: 14px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .option-card.selected-bounce .option-badge {
        background: #f59e0b;
        color: #1f1b16;
      }

      .option-check {
        width: 28px;
        height: 28px;
        border-radius: 999px;
        background: #1f1b16;
        color: #fffdf3;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .option-label {
        margin: 16px 0 0;
        font-size: 16px;
        font-weight: 700;
        line-height: 1.45;
        color: #1f1b16;
      }

      .option-detail {
        margin: 8px 0 0;
        font-size: 12.5px;
        line-height: 1.5;
        color: #645a4b;
      }

      /* Result Screen */
      .result-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 24px;
        align-items: start;
      }

      .result-main-card {
        overflow: hidden;
        border-radius: 24px;
        background: #ffffff;
        border-width: 1px;
        border-style: solid;
        box-shadow: 0 16px 44px -22px rgba(31, 27, 22, 0.2);
      }

      .result-hero {
        padding: 28px 24px;
        border-bottom-width: 1px;
        border-bottom-style: solid;
      }

      .result-hero-inner {
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      .result-illus-wrap {
        width: 100%;
        max-width: 172px;
      }

      .result-kicker {
        margin: 0;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .result-title {
        margin: 8px 0 0;
        font-size: 36px;
        font-weight: 800;
        line-height: 1.12;
        letter-spacing: -0.03em;
        color: #1f1b16;
      }

      .result-nickname {
        margin: 12px 0 0;
        font-size: 16px;
        font-weight: 700;
        line-height: 1.4;
      }

      .result-body {
        padding: 24px;
      }

      .result-desc p {
        margin: 0 0 10px;
        font-size: 15px;
        line-height: 1.7;
        color: #3d362c;
      }

      .result-desc p:last-child {
        margin-bottom: 0;
      }

      .highlights-strip {
        margin-top: 24px;
        padding: 16px;
        border-radius: 18px;
        border-width: 1px;
        border-style: solid;
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .highlight-label {
        margin: 0;
        font-size: 12px;
        font-weight: 700;
      }

      .highlight-value {
        margin: 4px 0 0;
        font-size: 14px;
        font-weight: 600;
        color: #1f1b16;
      }

      .highlight-second {
        padding-top: 12px;
        border-top-width: 1px;
        border-top-style: solid;
      }

      .breakdown-section {
        margin-top: 28px;
        padding-top: 24px;
        border-top-width: 1px;
        border-top-style: solid;
      }

      .breakdown-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
      }

      .breakdown-head h2 {
        margin: 0;
        font-size: 14px;
        font-weight: 700;
      }

      .breakdown-head span {
        font-size: 12px;
        color: #645a4b;
        font-variant-numeric: tabular-nums;
      }

      .breakdown-list {
        margin-top: 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .bar-label-row {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        margin-bottom: 4px;
      }

      .bar-track {
        height: 10px;
        width: 100%;
        border-radius: 999px;
        overflow: hidden;
      }

      .bar-fill {
        height: 100%;
        border-radius: 999px;
        transition: width 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .result-actions {
        margin-top: 32px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .share-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 50px;
        padding: 12px 28px;
        border-radius: 16px;
        font-size: 16px;
        font-weight: 700;
        transition: transform 0.16s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.16s ease;
        white-space: nowrap;
      }

      .share-btn:hover {
        transform: translateY(-2px) scale(1.015);
        opacity: 0.95;
      }

      .share-btn:active {
        transform: translateY(2px) scale(0.97);
      }

      .restart-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 50px;
        padding: 12px 24px;
        border-radius: 16px;
        background: #ffffff;
        border-width: 1px;
        border-style: solid;
        font-size: 14px;
        font-weight: 700;
        color: #1f1b16;
        transition: background-color 0.16s ease, transform 0.16s ease;
        white-space: nowrap;
      }

      .restart-btn:hover {
        background: #faf8f2;
      }

      .share-status {
        margin: 12px 0 0;
        font-size: 12px;
        font-weight: 600;
      }

      .result-side-card {
        padding: 24px;
        border-radius: 24px;
        background: #ffffff;
        border-width: 1px;
        border-style: solid;
        box-shadow: 0 16px 44px -22px rgba(31, 27, 22, 0.2);
      }

      .side-title {
        margin: 6px 0 0;
        font-size: 20px;
        font-weight: 700;
      }

      .side-sub {
        margin: 6px 0 0;
        font-size: 14px;
        line-height: 1.6;
        color: #5c5346;
      }

      .rec-list {
        list-style: none;
        margin: 24px 0 0;
        padding: 0;
      }

      .rec-item {
        padding: 16px 0;
        border-bottom-width: 1px;
        border-bottom-style: solid;
      }

      .rec-item:first-child {
        padding-top: 0;
      }

      .rec-item:last-child {
        padding-bottom: 0;
        border-bottom: none;
      }

      .rec-row {
        display: flex;
        align-items: baseline;
        gap: 10px;
      }

      .rec-num {
        font-size: 12px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }

      .rec-cat {
        margin: 0;
        font-size: 12px;
        font-weight: 600;
      }

      .rec-title {
        margin: 2px 0 0;
        font-size: 16px;
        font-weight: 700;
        color: #1f1b16;
      }

      .rec-reason {
        margin: 4px 0 0;
        font-size: 14px;
        line-height: 1.55;
        color: #5c5346;
      }

      .campus-tip {
        margin-top: 24px;
        padding: 16px;
        border-radius: 18px;
        border-width: 1px;
        border-style: solid;
      }

      .campus-tip-title {
        margin: 0;
        font-size: 12px;
        font-weight: 700;
      }

      .campus-tip-body {
        margin: 6px 0 0;
        font-size: 14px;
        line-height: 1.6;
        color: #3d362c;
      }

      /* Footer */
      .app-footer {
        width: 100%;
        max-width: 1024px;
        margin: 0 auto;
        padding: 16px;
        font-size: 12px;
        color: #857862;
        text-align: center;
      }

      /* Animations */
      @keyframes bouncePop {
        0% {
          transform: scale(1) translateY(0);
        }
        35% {
          transform: scale(1.045) translateY(-7px);
        }
        70% {
          transform: scale(0.985) translateY(0);
        }
        100% {
          transform: scale(1.015) translateY(-2px);
        }
      }

      @keyframes cardSlideIn {
        from {
          opacity: 0;
          transform: translateX(14px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      /* Responsive Breakpoints */
      @media (min-width: 640px) {
        .top-header-inner {
          padding: 14px 24px;
        }
        .header-right-note {
          display: inline;
        }
        .main-stage {
          padding: 40px 24px;
        }
        .start-grid {
          padding: 32px;
        }
        .start-title {
          font-size: 36px;
        }
        .tracks-grid {
          grid-template-columns: 1fr 1fr;
        }
        .start-cta-row {
          flex-direction: row;
          align-items: center;
        }
        .cta-hint {
          text-align: left;
        }
        .progress-box {
          padding: 14px 24px;
        }
        .question-card {
          padding: 32px;
        }
        .question-prompt {
          font-size: 24px;
        }
        .result-hero {
          padding: 32px;
        }
        .result-hero-inner {
          flex-direction: row;
          align-items: center;
        }
        .result-illus-wrap {
          width: 176px;
          flex-shrink: 0;
        }
        .result-title {
          font-size: 46px;
        }
        .result-nickname {
          font-size: 18px;
        }
        .result-body {
          padding: 32px;
        }
        .highlights-strip {
          grid-template-columns: 1fr 1fr;
          gap: 24px;
          padding: 20px;
        }
        .highlight-second {
          padding-top: 0;
          padding-left: 24px;
          border-top: none;
          border-left-width: 1px;
          border-left-style: solid;
        }
        .result-actions {
          flex-direction: row;
          align-items: center;
        }
        .result-side-card {
          padding: 32px;
        }
        .app-footer {
          padding: 16px 24px;
          text-align: left;
        }
      }

      @media (min-width: 768px) {
        .options-grid {
          grid-template-columns: 1fr 1fr;
        }
        .option-card {
          min-height: 176px;
          padding: 24px;
        }
      }

      @media (min-width: 1024px) {
        .start-grid {
          grid-template-columns: 7fr 5fr;
          gap: 40px;
          padding: 40px;
          align-items: stretch;
        }
        .start-title {
          font-size: 42px;
        }
        .result-grid {
          grid-template-columns: 7fr 5fr;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="app" class="app-shell">
      <header id="top-header" class="top-header">
        <div class="top-header-inner">
          <button type="button" id="brand-btn" class="brand-btn">
            나에게 맞는 직무 유형 테스트
          </button>
          <div id="header-right"></div>
        </div>
      </header>

      <main id="main-stage" class="main-stage"></main>

      <footer class="app-footer">
        대학생 진로 탐색을 위한 12문항 직무 유형 가이드
      </footer>
    </div>

    <script>
      const ILLUSTRATIONS = {
        start: `
          <svg viewBox="0 0 360 270" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="대학생 책상 위의 노트, 나침반, 포스트잇 일러스트">
            <rect width="360" height="270" rx="16" fill="#FEF9E7"/>
            <rect x="44" y="90" width="272" height="145" rx="14" fill="#D49A6A" stroke="#1F1B16" stroke-width="2.5"/>
            <rect x="64" y="235" width="16" height="24" fill="#B87D50" stroke="#1F1B16" stroke-width="2.5"/>
            <rect x="280" y="235" width="16" height="24" fill="#B87D50" stroke="#1F1B16" stroke-width="2.5"/>
            <!-- Notebook -->
            <rect x="92" y="106" width="128" height="94" rx="8" transform="rotate(-8 92 106)" fill="#FFFDF5" stroke="#1F1B16" stroke-width="2.5"/>
            <line x1="154" y1="100" x2="167" y2="190" stroke="#1F1B16" stroke-width="2"/>
            <circle cx="125" cy="138" r="15" fill="#FDE68A" stroke="#1F1B16" stroke-width="2"/>

      function calculateJobResult(answers) {
        const counts = { pm: 0, dev: 0, design: 0, data: 0 };
        answers.forEach((type) => {
          counts[type] += 1;
        });

        const maxScore = Math.max(...Object.values(counts));
        const tiedTypes = Object.keys(counts).filter((type) => counts[type] === maxScore);

        if (tiedTypes.length === 1) {
          return { winner: JOB_PROFILES[tiedTypes[0]], counts };
        }

        const h2hWins = { pm: 0, dev: 0, design: 0, data: 0 };
        QUIZ_QUESTIONS.forEach((q, idx) => {
          const chosen = answers[idx];
          if (!chosen) return;
          const tA = q.options[0].type;
          const tB = q.options[1].type;
          if (tiedTypes.includes(tA) && tiedTypes.includes(tB)) {
            h2hWins[chosen] += 1;
          }
        });

        const maxH2H = Math.max(...tiedTypes.map((t) => h2hWins[t]));
        const afterH2H = tiedTypes.filter((t) => h2hWins[t] === maxH2H);
        if (afterH2H.length === 1) {
          return { winner: JOB_PROFILES[afterH2H[0]], counts };
        }

        for (let i = answers.length - 1; i >= 0; i -= 1) {
          if (afterH2H.includes(answers[i])) {
            return { winner: JOB_PROFILES[answers[i]], counts };
          }
        }
        return { winner: JOB_PROFILES[afterH2H[0]], counts };
      }

      async function copyTextToClipboard(text) {
        if (navigator.clipboard && window.isSecureContext) {
          try {
            await navigator.clipboard.writeText(text);
            return true;
          } catch (e) {}
        }
        try {
          const textarea = document.createElement('textarea');
          textarea.value = text;
          textarea.setAttribute('readonly', '');
          textarea.style.position = 'fixed';
          textarea.style.top = '-9999px';
          textarea.style.left = '-9999px';
          document.body.appendChild(textarea);
          textarea.select();
          const ok = document.execCommand('copy');
          document.body.removeChild(textarea);
          return ok;
        } catch (e) {
          return false;
        }
      }

                                </span>
                              </div>
                              <div class="bar-track" style="background-color:${t.heroBg};">
                                <div class="bar-fill" style="width:${pct}%;background-color:${isWinner ? t.barColor : '#D9D2C5'};"></div>
                              </div>
                            </div>
                          `;
                        })
                        .join('')}
                    </div>
                  </div>

                  <div class="result-actions">
                    <button
                      type="button"
                      id="share-btn"
                      class="share-btn"
                      style="background-color:${t.buttonBg};color:${t.buttonText};box-shadow:0 5px 0 ${t.buttonShadow};"
                    >
                      <span id="share-btn-label">공유하기</span>
                    </button>
                    <button
                      type="button"
                      id="restart-btn"
                      class="restart-btn"
                      style="border-color:${t.cardBorder};"
                    >
                      <span>↻ 다시하기</span>
                    </button>
                  </div>
                  <p id="share-status" class="share-status" style="color:${t.accentText};display:none;" role="status" aria-live="polite"></p>
                </div>
              </div>

              <aside class="result-side-card" style="border-color:${t.cardBorder};">
                <p class="result-kicker" style="color:${t.accentText};">바로 준비해 볼 만한 로드맵</p>
                <h2 class="side-title">추천 자격증 · 과목 3가지</h2>
                <p class="side-sub">
                  전공이나 배경지식이 많지 않아도 대학 재학 중 부담 없이 시작할 수 있는 항목들로 골랐어요.
                </p>

                <ol class="rec-list">
                  ${winner.recommendations
                    .map(
                      (rec, idx) => `
                    <li class="rec-item" style="border-bottom-color:${t.cardBorder};">
                      <div class="rec-row">
                        <span class="rec-num" style="color:${t.accentText};">0${idx + 1}.</span>
                        <div>
                          <p class="rec-cat" style="color:${t.accentText};">${rec.category}</p>
                          <h3 class="rec-title">${rec.title}</h3>
                          <p class="rec-reason">${rec.reason}</p>
                        </div>
                      </div>
                    </li>
                  `
                    )
                    .join('')}
                </ol>

                <div class="campus-tip" style="background-color:${t.softSurface};border-color:${t.cardBorder};">
                  <p class="campus-tip-title" style="color:${t.accentText};">이번 학기 추천 한 걸음</p>
                  <p class="campus-tip-body">${winner.campusTip}</p>
                </div>
              </aside>
            </div>
          </section>
        `;

        document.getElementById('restart-btn').addEventListener('click', restartQuiz);

        const shareBtn = document.getElementById('share-btn');
        const shareLabel = document.getElementById('share-btn-label');
        const shareStatus = document.getElementById('share-status');

        shareBtn.addEventListener('click', async () => {
          const shareText = [
            '[나에게 맞는 직무 유형 테스트 결과]',
            `나의 직무 유형: ${winner.title}`,
            `"${winner.nickname}"`,
            '',
            winner.description[0],
            `추천 준비: ${winner.recommendations.map((r) => r.title).join(' · ')}`,
          ].join('\n');

          const ok = await copyTextToClipboard(shareText);
          shareLabel.textContent = ok ? '✓ 클립보드에 복사했어요' : '공유하기';
          shareStatus.textContent = ok
            ? '결과 텍스트가 클립보드에 복사되었어요. 친구나 메모장에 바로 붙여넣어 보세요!'
            : '클립보드 복사에 실패했어요. 다시 한 번 눌러주세요.';
          shareStatus.style.display = 'block';

          window.setTimeout(() => {
            shareLabel.textContent = '공유하기';
            shareStatus.style.display = 'none';
          }, 2600);
        });
      }

      function restartQuiz() {
        state.answers = [];
        state.currentIndex = 0;
        state.step = 'start';
        state.isTransitioning = false;
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function render() {
        if (state.step === 'start') {
          renderStart();
        } else if (state.step === 'quiz') {
          renderQuiz();
        } else {
          renderResult();
        }
      }

      brandBtnEl.addEventListener('click', restartQuiz);
      render();
    </script>
  </body>
</html>
